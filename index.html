<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omelas 어휘 시험</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;700&display=swap');

  :root{
    --plum:#1b1420;
    --plum-deep:#120d16;
    --parchment:#f2e9e4;
    --mauve:#b48fc2;
    --gold:#d1a441;
    --bronze:#8a6a3b;
    --crack:#5c1f2a;
    --ok:#c9a94e;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(180,143,194,0.16), transparent 55%),
      var(--plum-deep);
    color:var(--parchment);
    font-family:'Karla',sans-serif;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .wrap{width:100%;max-width:480px;}
  header{text-align:center;margin-bottom:22px;}
  .eyebrow{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--mauve);margin-bottom:6px;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:34px;
    margin:0 0 4px;
    letter-spacing:.01em;
  }
  .sub{font-size:12.5px;color:#c9bcc9;opacity:.85;}

  .progress-row{
    display:flex;align-items:center;gap:10px;margin:20px 0 18px;
  }
  .progress-track{
    flex:1;height:3px;background:rgba(255,255,255,0.12);border-radius:2px;overflow:hidden;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg,var(--bronze),var(--gold));
    width:0%;transition:width .35s ease;
  }
  .progress-label{font-size:11px;color:#a99aa8;white-space:nowrap;font-variant-numeric:tabular-nums;}

  .card{
    background:linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid rgba(255,255,255,0.09);
    border-radius:14px;
    padding:26px 22px 22px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:.6;
  }
  .direction{
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:6px;
  }
  .direction .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);}

  .question{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:29px;
    line-height:1.35;
    margin-bottom:22px;
    color:#fbf6f2;
    min-height:78px;
    display:flex;align-items:center;
  }
  .question.en{font-style:normal;font-weight:600;font-size:32px;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    text-align:left;
    background:rgba(255,255,255,0.035);
    border:1px solid rgba(255,255,255,0.13);
    color:var(--parchment);
    border-radius:9px;
    padding:13px 15px;
    font-size:15px;
    font-family:'Karla',sans-serif;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .opt:active{transform:scale(0.98);}
  .opt:hover{border-color:rgba(255,255,255,0.3);}
  .opt.correct{
    background:rgba(209,164,65,0.18);
    border-color:var(--gold);
    color:var(--ok);
  }
  .opt.wrong{
    background:rgba(92,31,42,0.35);
    border-color:var(--crack);
  }
  .opt[disabled]{cursor:default;}

  .feedback{
    min-height:20px;margin-top:14px;font-size:12.5px;color:#a99aa8;
    display:flex;justify-content:space-between;align-items:center;
  }
  .next-btn{
    background:none;border:1px solid var(--gold);color:var(--gold);
    padding:6px 14px;border-radius:7px;font-size:12px;cursor:pointer;
    font-family:'Karla',sans-serif;letter-spacing:.03em;
    visibility:hidden;
  }
  .next-btn.show{visibility:visible;}

  .score-row{
    display:flex;justify-content:space-between;margin-top:16px;
    font-size:11px;color:#a99aa8;letter-spacing:.05em;
  }
  .score-row b{color:var(--parchment);}

  .done{
    text-align:center;padding:40px 10px;
  }
  .done h2{
    font-family:'Cormorant Garamond',serif;font-size:30px;margin-bottom:8px;font-weight:600;
  }
  .done p{color:#c9bcc9;font-size:13.5px;margin-bottom:24px;}
  .restart{
    background:linear-gradient(90deg,var(--bronze),var(--gold));
    border:none;color:#1b1420;font-weight:700;
    padding:12px 26px;border-radius:9px;font-size:14px;cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">D.F.L.H.S · 공통영어2</div>
    <h1>Omelas Vocabulary</h1>
    <div class="sub">The Ones Who Walk Away From Omelas · 전 159단어 · 영→한, 한→영 각 1회</div>
  </header>

  <div id="quiz-area">
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0 / 0</div>
    </div>

    <div class="card">
      <div class="direction"><span class="dot"></span><span id="directionLabel">ENGLISH → 한국어</span></div>
      <div class="question" id="questionText"></div>
      <div class="options" id="optionsArea"></div>
      <div class="feedback">
        <span id="feedbackText"></span>
        <button class="next-btn" id="nextBtn">다음 →</button>
      </div>
    </div>

    <div class="score-row">
      <span>맞음: <b id="scoreCorrect">0</b></span>
      <span>틀림: <b id="scoreWrong">0</b></span>
    </div>
  </div>

  <div id="doneArea" style="display:none;" class="done">
    <h2>시험 완료</h2>
    <p id="finalSummary"></p>
    <button class="restart" id="restartBtn">다시 풀기</button>
  </div>
</div>

<script>
const WORDS = [["clamor", "n. 요란한 울림"], ["swallow", "n. 제비"], ["soar", "v. (하늘 높이) 솟구치다, 날아오르다"], ["sparkle", "v. 반짝이다"], ["procession", "n. 행렬, 행진"], ["decorous", "a. 예의 바른, 단정한"], ["mauve", "n. 연보라색"], ["grave", "a. 엄숙한, 진지한"], ["merry", "a. 즐거운, 명랑한"], ["shimmering", "n. 은은한 번쩍임, 어른거림"], ["gong", "n. 징"], ["dodge", "v. 요리조리 피하다, 재빨리 움직이다"], ["wind-wound-wound", "v. 구불구불 나아가다"], ["lithe", "a. 유연한, 부드러운"], ["restive", "a. (제어하기 어렵게) 고집 센, 가만히 못 있는"], ["halter", "n. (말의) 고삐, 마구"], ["bit", "n. 재갈"], ["mane", "n. 갈기"], ["be braided with", "v. ~로 땋아지다"], ["streamer", "n. 장식 리본, 색띠"], ["flare", "v. (콧구멍을) 벌렁거리다"], ["nostril", "n. 콧구멍"], ["prance", "v. 활보하다, 껑충거리며 다니다"], ["adopt", "v. 채택하다, 받아들이다"], ["ceremony", "n. 의식, 행사"], ["encircle", "v. 둘러싸다, 에워싸다"], ["crown", "v. (산 꼭대기 등을) 뒤덮다, 왕관처럼 얹히다"], ["banner", "n. 현수막, 깃발"], ["snap", "v. (깃발 등이 바람에) 펄럭이다, 탁탁 소리를 내다"], ["flutter", "v. 펄럭이다, 흔들리다"], ["now and then", "ad. 때때로, 가끔"], ["meadow", "n. 목초지, 풀밭"], ["from time to time", "ad. 때때로, 이따금"], ["tremble", "v. 떨다, 진동하다"], ["break out", "v. (소리 등이) 갑자기 터져 나오다"], ["clang", "n. 댕그랑거리는 소리, 울림"], ["archaic", "a. 구식의, 예스러운"], ["assumption", "n. 추정, 가정"], ["mount", "v. (말 등에) 올라타다"], ["splendid", "a. 화려한, 훌륭한"], ["stallion", "n. 씨수말, (다 자란) 수말"], ["knight", "n. 기사"], ["barbarian", "n. 야만인"], ["monarchy", "n. 군주제"], ["dulcet", "a. 감미로운, 유순한"], ["shepherd", "n. 양치기"], ["savage", "n. 미개인, 야만인"], ["bland", "a. 특징 없는, 단조로운"], ["pedant", "n. 현학자, 규칙에 얽매이는 사람"], ["sophisticate", "n. 세련된 사람, 세상 물정에 밝은 사람"], ["treason", "n. 배신, 배반"], ["refusal", "n. 거부, 거절"], ["banality", "n. 평범함, 따분함"], ["lick", "v. 이기다, 해치우다"], ["condemn", "v. 규탄하다, 비난하다"], ["wretch", "n. 가엾은 사람, 불쌍한 자 (wretched: 비참한)"], ["bid", "v. 명령하다, 권하다"], ["discrimination", "n. 식별, 구별"], ["exuberance", "n. 풍요, 활기"], ["marvelous", "a. 경이로운, 놀라운"], ["magnificent", "a. 장엄한, 훌륭한"], ["grant", "v. 인정하다, 허용하다"], ["goody-goody", "a. 지나치게 고결한 척하는"], ["bleh", "에이, 퉤 (지루함·불쾌함의 감탄사)"], ["orgy", "n. 난장판, 진탕 먹고 마시며 노는 잔치"], ["priest", "n. 사제, 신부"], ["priestess", "n. 여사제"], ["ecstasy", "n. 황홀경, 무아지경"], ["copulate", "v. 성관계를 맺다, 결합하다"], ["clergy", "n. 성직자(들)"], ["divine", "a. 신성한, 신의"], ["souffle", "n. 수플레 (가볍고 부푼 요리)"], ["rapture", "n. 황홀감, 환희"], ["copulation", "n. 성관계, 결합"], ["gory", "a. 유혈의, 피투성이의"], ["proclaim", "v. 선언하다, 선포하다"], ["offspring", "n. 자식, 후손"], ["ritual", "n. 의식, 의례"], ["guilt", "n. 죄책감"], ["puritanical", "a. 청교도적인, 엄격한"], ["insistent", "a. 끈질긴, 지속적인"], ["limb", "n. 사지, 팔다리"], ["languor", "n. 나른함, 무기력"], ["arcane", "a. 신비로운, 불가사의한"], ["inmost", "a. 가장 깊숙한, 마음속 깊은"], ["modest", "a. 수수한, 소박한"], ["slaughter", "n. 대량 학살, 살육"], ["boundless", "a. 무한한, 끝없는"], ["contentment", "n. 만족(감)"], ["magnanimous", "a. 도량이 넓은, 너그러운"], ["in communion with", "~와 교감하여, 통하여"], ["splendor", "n. 장려함, 찬란함, 화려함"], ["swell", "v. 벅차오르다, 부풀다"], ["provisioner", "n. 조달업자"], ["amiably", "ad. 상냥하게, 다정하게"], ["benign", "a. 인자한, 자애로운"], ["entangle", "v. 얽히게 하다, 걸리다"], ["pause", "v. 잠시 멈추다"], ["cease", "v. 중단하다, 그치다"], ["rapt", "a. 완전히 몰입한, 넋이 빠진"], ["pavilion", "n. 가설 무대, 특설 천막"], ["imperious", "a. 오만한, 위엄 있는, 긴박한"], ["pierce", "v. 꿰뚫다, 가르다"], ["rear", "v. (말 등이) 뒷다리로 서다"], ["neigh", "v. (말이) 히힝 울다"], ["sober-faced", "a. 진지한 표정의, 엄숙한"], ["soothe", "v. 달래다, 진정시키다"], ["cellar", "n. 지하 저장실, 지하실"], ["spacious", "a. 널찍한, 거대한"], ["seep", "v. (빛·물 등이) 스며들다"], ["crack", "n. 틈새"], ["cobwebbed", "a. 거미줄이 처진"], ["rusty", "a. 녹슨"], ["bucket", "n. 양동이"], ["defective", "a. 결함이 있는, 불완전한"], ["imbecile", "n. 저능아, 정신 지체자"], ["malnutrition", "n. 영양실조"], ["neglect", "n. 방치, 소홀"], ["fumble", "v. 더듬거리다, 만지작거리다"], ["rattle", "v. 덜컹거리다"], ["peer", "v. 자세히 들여다보다, 응시하다"], ["whine", "n. 징징거리는 소리, 애처로운 소리"], ["calf", "n. 종아리 (복수형 calves)"], ["protrude", "v. 튀어나오다, 튀어나오게 하다"], ["thigh", "n. 허벅지"], ["fester", "v. (상처가) 곪다, 진물이 나다"], ["sore", "n. 상처, 진물"], ["excrement", "n. 배설물, 대변"], ["content", "a. 만족하는 / v. 만족하다"], ["abundance", "n. 풍요, 과잉"], ["abominable", "a. 끔찍한, 혐오스러운"], ["misery", "n. 비참함, 고통"], ["spectator", "n. 구경꾼, 관객, 목격자"], ["sicken", "v. 역겨워지다, 구역질 나다"], ["superior", "a. 우월한, 우수한"], ["outrage", "n. 분노, 격분"], ["impotence", "n. 무력감, 무능함"], ["vile", "a. 비열한, 극도로 혐오스러운"], ["prosperity", "n. 번영, 풍요"], ["wither", "v. 시들다, 무너지다"], ["term", "n. 조건, 계약 조건"], ["rage", "n. 분노, 격분"], ["brood over", "v. ~을 곱씹다, 암울하게 생각하다"], ["degrade", "v. 비하하다, 타락시키다"], ["uncouth", "a. 거친, 미개한, 무례한"], ["humane", "a. 인도적인, 자비로운"], ["vapid", "a. 지루한, 흥미진진하지 못한"], ["compassion", "n. 연민, 동정심"], ["existence", "n. 존재"], ["nobility", "n. 고결함, 숭고함"], ["architecture", "n. 건축(물)"], ["poignancy", "n. 애절함, 마음을 파고드는 감동"], ["profundity", "n. 깊이 있음, 심오함"], ["sniveling", "a. 코를 훌쩍이는, 징징거리는"], ["credible", "a. 믿을 만한, 신용할 수 있는"], ["incredible", "a. 믿기 힘든, 경이로운"], ["adolescent", "n. 청소년, 사춘기 청년"], ["weep", "v. 눈물을 흘리다, 울다"], ["imaginable", "a. 상상할 수 있는"]];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let questions = [];
let qIndex = 0;
let correct = 0;
let wrong = 0;
let answered = false;

function buildQuestions(){
  const list = [];
  WORDS.forEach(([en, ko]) => {
    list.push({dir:'e2k', en, ko});
    list.push({dir:'k2e', en, ko});
  });
  questions = shuffle(list);
  qIndex = 0; correct = 0; wrong = 0;
  document.getElementById('doneArea').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  renderQuestion();
}

function pickDistractors(correctAnswer, key, count){
  const pool = WORDS.map(w => key === 'ko' ? w[1] : w[0]).filter(v => v !== correctAnswer);
  return shuffle(pool).slice(0, count);
}

function renderQuestion(){
  answered = false;
  const total = questions.length;
  document.getElementById('progressLabel').textContent = `${qIndex}/${total}`;
  document.getElementById('progressFill').style.width = (qIndex/total*100)+'%';
  document.getElementById('scoreCorrect').textContent = correct;
  document.getElementById('scoreWrong').textContent = wrong;
  document.getElementById('feedbackText').textContent = '';
  document.getElementById('nextBtn').classList.remove('show');

  if(qIndex >= total){
    finish();
    return;
  }

  const q = questions[qIndex];
  const qEl = document.getElementById('questionText');
  const dirLabel = document.getElementById('directionLabel');

  let correctAnswer, distractKey;
  if(q.dir === 'e2k'){
    qEl.textContent = q.en;
    qEl.className = 'question en';
    dirLabel.textContent = 'ENGLISH → 한국어';
    correctAnswer = q.ko;
    distractKey = 'ko';
  } else {
    qEl.textContent = q.ko;
    qEl.className = 'question';
    dirLabel.textContent = '한국어 → ENGLISH';
    correctAnswer = q.en;
    distractKey = 'en';
  }

  const distractors = pickDistractors(correctAnswer, distractKey, 3);
  const options = shuffle([correctAnswer, ...distractors]);

  const area = document.getElementById('optionsArea');
  area.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = () => selectOption(btn, opt, correctAnswer);
    area.appendChild(btn);
  });
}

function selectOption(btn, opt, correctAnswer){
  if(answered) return;
  answered = true;
  const allOpts = document.querySelectorAll('.opt');
  allOpts.forEach(o => o.setAttribute('disabled','true'));

  if(opt === correctAnswer){
    btn.classList.add('correct');
    correct++;
    document.getElementById('feedbackText').textContent = '정답입니다.';
  } else {
    btn.classList.add('wrong');
    allOpts.forEach(o => { if(o.textContent === correctAnswer) o.classList.add('correct'); });
    wrong++;
    document.getElementById('feedbackText').textContent = '오답 — 정답이 표시되었습니다.';
  }
  document.getElementById('scoreCorrect').textContent = correct;
  document.getElementById('scoreWrong').textContent = wrong;
  document.getElementById('nextBtn').classList.add('show');
}

document.getElementById('nextBtn').onclick = () => {
  qIndex++;
  renderQuestion();
};

function finish(){
  document.getElementById('quiz-area').style.display = 'none';
  const doneArea = document.getElementById('doneArea');
  doneArea.style.display = 'block';
  const total = questions.length;
  const pct = Math.round(correct/total*100);
  document.getElementById('finalSummary').textContent =
    `총 ${total}문제 중 ${correct}개 정답 (${pct}%) · 오답 ${wrong}개`;
}

document.getElementById('restartBtn').onclick = buildQuestions;

buildQuestions();
</script>
</body>
</html>
